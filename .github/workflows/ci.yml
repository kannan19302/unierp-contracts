# L0 CI. Per PLATFORM_ARCHITECTURE.md § 4.6 a repository declares WHICH gates
# apply and never HOW a gate works — the implementations become reusable
# workflows in unierp-workspace once that repository is extracted (§ 14 Phase
# 3.8). Until then these are declared inline and must be replaced, not copied
# onward: hand-copying between repositories is exactly how the Dockerfile bug in
# § 1.1 propagated to four repos and was fixed three separate times.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    name: Static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npx tsc

  # The invariant that makes L0 the root of the graph: it depends on nothing.
  # Checked mechanically, because "we all know not to add a dependency here" is
  # the kind of rule that survives exactly until the first inconvenient Tuesday.
  no-dependencies:
    name: L0 has no runtime dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert zero runtime dependencies
        run: |
          deps=$(node -p "Object.keys(require('./package.json').dependencies||{}).length")
          if [ "$deps" != "0" ]; then
            echo "::error::L0 must have zero runtime dependencies; found $deps."
            echo "PLATFORM_ARCHITECTURE.md § 7.1 — L0 can never be made to depend on an implementation."
            exit 1
          fi
          echo "L0 dependency count: 0"
